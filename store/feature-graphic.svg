<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0661E"/>
      <stop offset="1" stop-color="#A9370A"/>
    </linearGradient>
    <clipPath id="card"><rect x="560" y="60" width="400" height="380" rx="28"/></clipPath>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- texte -->
  <g font-family="Segoe UI, Roboto, system-ui, sans-serif" fill="#FFFFFF">
    <g transform="translate(64 150) scale(1.15) translate(-54 -55)" fill="#FFFFFF" opacity=".95">
      <path d="M54,52c-9,0 -17,9 -17,16c0,6 5,9 10,8c3,-0.5 5,-1.5 7,-1.5s4,1 7,1.5c5,1 10,-2 10,-8c0,-7 -8,-16 -17,-16z"/>
      <ellipse cx="37" cy="48" rx="5.5" ry="7"/><ellipse cx="47" cy="38" rx="5.5" ry="7"/>
      <ellipse cx="61" cy="38" rx="5.5" ry="7"/><ellipse cx="71" cy="48" rx="5.5" ry="7"/>
    </g>
    <text x="110" y="168" font-size="64" font-weight="700">Mantrailing</text>
    <text x="64" y="250" font-size="34" font-weight="600">La trace de votre chien,</text>
    <text x="64" y="294" font-size="34" font-weight="600">sur la piste du traceur.</text>
    <text x="64" y="356" font-size="22" opacity=".85">GPS du téléphone ou collier · carte IGN · écarts</text>
  </g>

  <!-- carte stylisée -->
  <g clip-path="url(#card)">
    <rect x="560" y="60" width="400" height="380" fill="#F4F1E8"/>
    <!-- courbes de niveau -->
    <g fill="none" stroke="#D8CFB8" stroke-width="2">
      <path d="M560 140 C 640 110, 720 170, 800 130 S 930 90, 960 120"/>
      <path d="M560 190 C 650 160, 720 230, 820 185 S 920 150, 960 175"/>
      <path d="M560 400 C 660 360, 760 420, 860 370 S 940 350, 960 360"/>
      <path d="M600 440 C 680 400, 780 450, 880 410 S 950 400, 960 410"/>
    </g>
    <!-- bois -->
    <path d="M820 230 C 870 210, 950 230, 960 260 L 960 340 C 920 360, 860 340, 830 310 C 800 285, 790 245, 820 230 Z" fill="#CFE3C0"/>
    <!-- chemin -->
    <path d="M560 300 C 640 290, 700 330, 760 300 S 880 250, 960 270" fill="none" stroke="#FFFFFF" stroke-width="10"/>
    <!-- piste du traceur -->
    <path d="M610 400 C 640 340, 600 290, 670 250 S 780 260, 800 200 S 860 130, 900 120"
          fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity=".85"/>
    <path d="M610 400 C 640 340, 600 290, 670 250 S 780 260, 800 200 S 860 130, 900 120"
          fill="none" stroke="#1C6DD0" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round"/>
    <!-- trace du chien -->
    <path d="M612 402 C 655 345, 590 300, 660 262 S 735 235, 770 262 S 790 225, 810 196 S 870 140, 896 124"
          fill="none" stroke="#D9480F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- points GPS -->
    <g fill="#862E00" stroke="#FFFFFF" stroke-width="2">
      <circle cx="626" cy="355" r="5"/><circle cx="628" cy="290" r="5"/><circle cx="700" cy="242" r="5"/>
      <circle cx="770" cy="262" r="5"/><circle cx="800" cy="210" r="5"/><circle cx="850" cy="150" r="5"/>
    </g>
    <circle cx="612" cy="402" r="10" fill="#D9480F" stroke="#FFFFFF" stroke-width="4"/>
    <!-- arrivée -->
    <circle cx="896" cy="124" r="16" fill="#2B8A3E" stroke="#FFFFFF" stroke-width="5"/>
  </g>
  <rect x="560" y="60" width="400" height="380" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="3"/>

  <!-- légende -->
  <g font-family="Segoe UI, Roboto, system-ui, sans-serif" font-size="17" fill="#3A2E28">
    <rect x="580" y="78" width="214" height="28" rx="14" fill="#FFFFFF" opacity=".92"/>
    <line x1="594" y1="92" x2="620" y2="92" stroke="#1C6DD0" stroke-width="4" stroke-dasharray="7 5"/>
    <text x="628" y="98">piste</text>
    <line x1="684" y1="92" x2="710" y2="92" stroke="#D9480F" stroke-width="6" stroke-linecap="round"/>
    <text x="718" y="98">chien</text>
  </g>
</svg>
